<svg xmlns="http://www.w3.org/2000/svg" width="600" height="208">
<rect width="600" height="208" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="30" font-family="monospace" font-size="13" fill="#30d158">анекдот дня</text>
<text x="24" y="58" font-family="monospace" font-size="14" fill="#c9d1d9">Встретились как-то русский, украинец и грузин — и</text><text x="24" y="82" font-family="monospace" font-size="14" fill="#c9d1d9">сели за стол.</text><text x="24" y="106" font-family="monospace" font-size="14" fill="#c9d1d9">Русский поднял рюмку: «Ну, за встречу!»</text><text x="24" y="130" font-family="monospace" font-size="14" fill="#c9d1d9">Украинец: «За здоровье!»</text><text x="24" y="154" font-family="monospace" font-size="14" fill="#c9d1d9">Грузин встал и говорит: «Друзья мои...»</text><text x="24" y="178" font-family="monospace" font-size="14" fill="#c9d1d9">Через час все поняли: тост только начался.</text>
</svg>
