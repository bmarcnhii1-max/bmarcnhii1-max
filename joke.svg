<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160">
<rect width="600" height="160" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="30" font-family="monospace" font-size="13" fill="#30d158">анекдот дня</text>
<text x="24" y="58" font-family="monospace" font-size="14" fill="#c9d1d9">Встретились как-то тестировщик и программист.</text><text x="24" y="82" font-family="monospace" font-size="14" fill="#c9d1d9">Тестировщик: «У меня всё падает».</text><text x="24" y="106" font-family="monospace" font-size="14" fill="#c9d1d9">Программист: «У меня всё работает. Наверное, у нас</text><text x="24" y="130" font-family="monospace" font-size="14" fill="#c9d1d9">разные продакшены».</text>
</svg>
