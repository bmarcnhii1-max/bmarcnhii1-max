<svg xmlns="http://www.w3.org/2000/svg" width="600" height="184">
<rect width="600" height="184" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="30" font-family="monospace" font-size="13" fill="#30d158">анекдот дня</text>
<text x="24" y="58" font-family="monospace" font-size="14" fill="#c9d1d9">Встретились как-то русский, украинец и белорус — и</text><text x="24" y="82" font-family="monospace" font-size="14" fill="#c9d1d9">давай жаловаться, у кого цены выше.</text><text x="24" y="106" font-family="monospace" font-size="14" fill="#c9d1d9">Русский: «У нас хлеб дорожает каждую неделю».</text><text x="24" y="130" font-family="monospace" font-size="14" fill="#c9d1d9">Украинец: «А у нас сало — уже деликатес».</text><text x="24" y="154" font-family="monospace" font-size="14" fill="#c9d1d9">Белорус: «А у нас всё стабильно. Стабильно дорого».</text>
</svg>
